<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathematics Certificate I</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: #0a0a0a;
            color: #00ff41;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1rem 2rem;
            border-bottom: 1px solid #00ff41;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-shrink: 0;
        }

        header a {
            color: #00ff41;
            text-decoration: none;
            font-size: 0.85rem;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        header a:hover { opacity: 1; }

        header span { opacity: 0.3; }

        header h1 {
            font-size: 1rem;
            font-weight: 500;
            color: #00ff41;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.4);
        }

        .pdf-container {
            flex: 1;
            padding: 0;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <header>
        <a href="home.html">{'< AI_Engineer />'}</a>
        <span>/</span>
        <h1>Mathematics Certificate I</h1>
    </header>
    <div class="pdf-container">
        <iframe src="pdfs/maths1.pdf" title="Mathematics Certificate I"></iframe>
    </div>
</body>
</html>
